services:
  gateway:
    build: .
    environment:
      PPROF_ADDRESS: 0.0.0.0:6060
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      FAILURE_RATE: "0"
    ports: ["8080:8080", "127.0.0.1:6060:6060"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4317:4317"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts:/etc/prometheus/alerts:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
