apiVersion: apps/v1
kind: Deployment
metadata: {name: jaeger, namespace: llm-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.68.0
          env: [{name: COLLECTOR_OTLP_ENABLED, value: "true"}]
          ports: [{name: ui, containerPort: 16686}, {name: otlp, containerPort: 4317}]
---
apiVersion: v1
kind: Service
metadata: {name: jaeger, namespace: llm-gateway}
spec:
  selector: {app: jaeger}
  ports: [{name: ui, port: 16686}, {name: otlp, port: 4317}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: llm-gateway}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    rule_files: [/etc/prometheus/rules/*.yml]
    scrape_configs:
      - job_name: llm-gateway
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: {names: [llm-gateway]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: gateway
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: llm-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: rules, mountPath: /etc/prometheus/rules}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: rules, configMap: {name: prometheus-rules}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: llm-gateway}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus-discovery, namespace: llm-gateway}
rules:
  - apiGroups: [""]
    resources: [endpoints, services, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus-discovery, namespace: llm-gateway}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: llm-gateway}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus-discovery}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: llm-gateway}
spec:
  selector: {app: prometheus}
  ports: [{name: http, port: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-config, namespace: llm-gateway}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: LLM Gateway
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: llm-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{name: http, containerPort: 3000}]
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - {name: config, configMap: {name: grafana-config}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: llm-gateway}
spec:
  selector: {app: grafana}
  ports: [{name: http, port: 3000}]
