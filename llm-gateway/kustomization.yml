apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/namespace.yml
  - k8s/gateway.yml
  - k8s/observability.yml
configMapGenerator:
  - name: prometheus-rules
    namespace: llm-gateway
    files:
      - rules.yml=alerts/rules.yml
  - name: grafana-dashboards
    namespace: llm-gateway
    files:
      - service-overview.json=dashboards/service-overview.json
      - capacity.json=dashboards/capacity.json
      - go-runtime.json=dashboards/go-runtime.json
      - slo.json=dashboards/slo.json
