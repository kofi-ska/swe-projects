services:
  multiwrite-smoke:
    build:
      context: .
      dockerfile: Dockerfile
    image: multiwrite:v1
    cpus: "1.0"
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      MULTIWRITE_ENV: compose
      MULTIWRITE_CPU_LIMIT: "1.0"
      MULTIWRITE_MEMORY_LIMIT: 256m
      MULTIWRITE_VOLUME_KIND: bind
      MULTIWRITE_IMAGE: multiwrite:v1
    volumes:
      - ./benchmarks/artifacts/outputs:/app/benchmarks/artifacts/outputs
      - ./benchmarks/artifacts/manifests:/app/benchmarks/artifacts/manifests
      - ./benchmarks/artifacts/profiles:/app/benchmarks/artifacts/profiles
      - ./benchmarks/artifacts/traces:/app/benchmarks/artifacts/traces
      - ./benchmarks/artifacts/syscalls:/app/benchmarks/artifacts/syscalls
    command:
      - run
      - --writer=buffered
      - --profile=tiny
      - --records=10000
      - --max-bytes=8388608
      - --max-duration=15s
      - --record-size=8
      - --buffer-size=16384
      - --seed=202
      - --out=benchmarks/artifacts/outputs/compose-smoke.txt
      - --manifest=benchmarks/artifacts/manifests/compose-smoke.json
      - --cpuprofile=benchmarks/artifacts/profiles/compose-smoke.cpu.pprof
      - --memprofile=benchmarks/artifacts/profiles/compose-smoke.mem.pprof
      - --trace=benchmarks/artifacts/traces/compose-smoke.trace
      - --durability=closed
      - --overwrite=replace

  multiwrite-direct:
    image: multiwrite:v1
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - benchmark
    cpus: "1.0"
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      MULTIWRITE_ENV: compose
      MULTIWRITE_CPU_LIMIT: "1.0"
      MULTIWRITE_MEMORY_LIMIT: 256m
      MULTIWRITE_VOLUME_KIND: bind
      MULTIWRITE_IMAGE: multiwrite:v1
    volumes:
      - ./benchmarks/artifacts/outputs:/app/benchmarks/artifacts/outputs
      - ./benchmarks/artifacts/manifests:/app/benchmarks/artifacts/manifests
      - ./benchmarks/artifacts/profiles:/app/benchmarks/artifacts/profiles
      - ./benchmarks/artifacts/traces:/app/benchmarks/artifacts/traces
      - ./benchmarks/artifacts/syscalls:/app/benchmarks/artifacts/syscalls
    command:
      - run
      - --writer=direct
      - --profile=fixed
      - --records=100000
      - --max-bytes=67108864
      - --max-duration=30s
      - --record-size=32
      - --seed=101
      - --out=benchmarks/artifacts/outputs/compose-direct-fixed.txt
      - --manifest=benchmarks/artifacts/manifests/compose-direct-fixed.json
      - --durability=closed
      - --overwrite=replace

  multiwrite-buffered:
    image: multiwrite:v1
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - benchmark
    cpus: "1.0"
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
      MULTIWRITE_ENV: compose
      MULTIWRITE_CPU_LIMIT: "1.0"
      MULTIWRITE_MEMORY_LIMIT: 256m
      MULTIWRITE_VOLUME_KIND: bind
      MULTIWRITE_IMAGE: multiwrite:v1
    volumes:
      - ./benchmarks/artifacts/outputs:/app/benchmarks/artifacts/outputs
      - ./benchmarks/artifacts/manifests:/app/benchmarks/artifacts/manifests
      - ./benchmarks/artifacts/profiles:/app/benchmarks/artifacts/profiles
      - ./benchmarks/artifacts/traces:/app/benchmarks/artifacts/traces
      - ./benchmarks/artifacts/syscalls:/app/benchmarks/artifacts/syscalls
    command:
      - run
      - --writer=buffered
      - --profile=fixed
      - --records=100000
      - --max-bytes=67108864
      - --max-duration=30s
      - --record-size=32
      - --buffer-size=16384
      - --seed=101
      - --out=benchmarks/artifacts/outputs/compose-buffered-fixed.txt
      - --manifest=benchmarks/artifacts/manifests/compose-buffered-fixed.json
      - --durability=closed
      - --overwrite=replace
